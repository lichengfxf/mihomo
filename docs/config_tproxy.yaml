# 最简 tproxy 验证配置
# 所有被 tproxy 接管的流量进入 mihomo，仅 baidu 走代理，其余直连

mixed-port: 7890

log-level: info
mode: rule

tproxy-port: 7893

proxies:
  - name: socks5-proxy
    type: socks5
    server: 192.168.100.198
    port: 8899

iptables:
  enable: true
  inbound-interface: ens33    # 改为你的出口网卡名
  bypass:
    - 192.168.100.20/32
  dns-redirect: true         # 劫持 DNS 到 mihomo 的 DNS 端口

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

rules:
  - DOMAIN-SUFFIX,baidu.com,socks5-proxy
  - MATCH,DIRECT
