# 最简 svnt 验证配置
# 仅 baidu.com 走 svnt，其余流量直连

mixed-port: 7890

log-level: info
mode: rule

tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - 0.0.0.0:53
    - '[::]:53'

proxies:
  - name: svnt-proxy
    type: svnt
    server: 192.168.198.200
    port: 9823
    key-data: 9C60A285DD88CDFACA9C9EFA156653EF
    policy-id: "DLPTunnel"
    encrypt: 2 # 0=明文 1=强制加密 2=按服务端策略协商
    # instance-id: mihomo
    # network: tcp

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

rules:
  - DOMAIN-SUFFIX,baidu.com,svnt-proxy
  - MATCH,DIRECT
