# 最简 tun 验证配置
# 仅 192.168.100.235 进入 TUN 并走 socks5-proxy，其余流量直连

mixed-port: 7890

log-level: info
log-file: /var/log/sdc-mihomo/mihomo.log
log-file-format: text
log-file-append: true
log-file-max-size: 20
log-file-max-backups: 5
log-file-max-age: 7
log-file-compress: true
mode: rule

tun:
  enable: true
  stack: system
  dns-hijack:
    - 0.0.0.0:53
  auto-route: true
  auto-detect-interface: true
  route-address:
    - 192.168.100.235/32

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: redir-host
  nameserver:
    - 8.8.8.8
    - 1.1.1.1

proxies:
  - name: socks5-proxy
    type: socks5
    server: 192.168.100.198
    port: 8899

rules:
  - IP-CIDR,192.168.100.235/32,socks5-proxy,no-resolve
  - MATCH,DIRECT
